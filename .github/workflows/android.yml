# «Заметно» — сборка Android-приложения (APK) на серверах GitHub.
# © 2026 Кобызев С. Е. Все права защищены.
#
# Запускается при каждой отправке изменений в main и вручную (Actions → Android APK → Run workflow).
# Готовый файл — в разделе Actions, в результатах запуска: «zametno-apk».

name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка и подпись APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Проект Capacitor из файлов приложения
        run: |
          mkdir build && cd build
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android \
                      @capacitor/filesystem @capacitor/share @capacitor/app
          npm install --save-dev @capacitor/assets
          mkdir www
          cp ../index.html ../help.html ../manifest.webmanifest ../sw.js www/
          cp -r ../icons www/
          cp ../android-app/capacitor.config.json .
          cp -r ../android-app/assets .
          npx cap add android
          npx capacitor-assets generate --android
          cp ../android-app/java/*.java android/app/src/main/java/ru/kobyzev/zametno/
          npx cap sync android

      - name: Номер версии
        run: |
          cd build/android/app
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Сборка
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Подпись постоянным ключом
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 build/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --out Zametno.apk aligned.apk
          rm -f release.p12
          "$BT/apksigner" verify --print-certs Zametno.apk
          "$BT/aapt2" dump badging Zametno.apk | grep -E "^package|application-label|sdkVersion|targetSdkVersion"
          ls -la Zametno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zametno-apk
          path: Zametno.apk

  check:
    name: Проверка в эмуляторе Android
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zametno-apk

      - name: Ускорение эмулятора (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Сценарий проверки
        run: |
          cat > check.sh << 'EOF'
          set -x
          adb install -r Zametno.apk
          adb shell am start -W -n ru.kobyzev.zametno/.MainActivity
          sleep 20
          adb exec-out screencap -p > screen-light.png
          adb shell cmd uimode night yes
          adb shell am force-stop ru.kobyzev.zametno
          adb shell am start -W -n ru.kobyzev.zametno/.MainActivity
          sleep 15
          adb exec-out screencap -p > screen-dark.png
          adb shell cmd uimode night no
          # Сохранение заметки: ввод текста, Ctrl+S, перезапуск приложения
          adb shell am force-stop ru.kobyzev.zametno
          adb shell am start -W -n ru.kobyzev.zametno/.MainActivity
          sleep 12
          adb shell input tap 160 360
          sleep 1
          adb shell input text "Proverka%sAPK"
          adb shell input keycombination 113 47
          sleep 2
          adb exec-out screencap -p > screen-typed.png
          adb shell am force-stop ru.kobyzev.zametno
          adb shell am start -W -n ru.kobyzev.zametno/.MainActivity
          sleep 12
          adb shell input swipe 160 560 160 120 400
          sleep 2
          adb exec-out screencap -p > screen-after-restart.png
          adb logcat -d > logcat-full.txt
          grep -iE "Capacitor|Console|chromium|AndroidRuntime|zametno" logcat-full.txt > logcat.txt || true
          # Автоматическая сверка: текст заметки должен быть в хранилище приложения
          # (эмулятор без сервисов Google позволяет прочитать данные приложения)
          adb root
          sleep 3
          adb wait-for-device
          adb pull /data/data/ru.kobyzev.zametno/app_webview app_webview
          python3 - << 'PY'
          import pathlib, sys
          needle = "Proverka APK"
          variants = [needle.encode("latin-1"), needle.encode("utf-16-le")]
          found = [str(p) for p in pathlib.Path("app_webview").rglob("*") if p.is_file()
                   and any(v in p.read_bytes() for v in variants)]
          if found:
              print("ПРОВЕРКА ПРОЙДЕНА: заметка сохранена в хранилище приложения:", found[0])
          else:
              print("ОШИБКА: заметка не найдена в хранилище приложения")
              sys.exit(1)
          PY
          EOF

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Чистый Android без сервисов Google: на серверах сборки они падают и закрывают приложение
          target: default
          arch: x86_64
          disable-animations: true
          script: bash check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check
          path: |
            screen-*.png
            logcat.txt

  release:
    name: Публикация APK по постоянной ссылке
    needs: [build, check]
    # Только для основной ветки и только если проверка в эмуляторе прошла
    if: github.ref == 'refs/heads/main' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zametno-apk

      - name: Обновить выпуск «android» (ссылка …/releases/latest/download/Zametno.apk)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: 1.0.${{ github.run_number }}
        run: |
          cat > notes.md << EOF
          **Заметно для Android — версия $VER**

          Постоянная ссылка на последнюю версию:
          https://github.com/$REPO/releases/latest/download/Zametno.apk

          **Установка:** откройте файл на телефоне → если попросит, разрешите установку из этого источника → «Установить».
          **Обновление:** установите новый файл поверх — заметки сохранятся.

          Веб-версия (iPhone, компьютер): https://kobyzev8051-creator.github.io/zametno/

          © 2026 Кобызев С. Е. Все права защищены.
          EOF
          if gh release view android --repo "$REPO" > /dev/null 2>&1; then
            gh release upload android Zametno.apk --clobber --repo "$REPO"
            gh release edit android --repo "$REPO" --title "Заметно для Android $VER" --notes-file notes.md --latest
          else
            gh release create android Zametno.apk --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Заметно для Android $VER" --notes-file notes.md --latest
          fi
          gh release view android --repo "$REPO"

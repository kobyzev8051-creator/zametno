# «Заметно» — заметки и дела. © 2026 Кобызев С. Е. Все права защищены.
[package]
name = "zametno"
version = "1.0.0"
description = "Заметно — заметки и дела"
authors = ["Кобызев С. Е."]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
open = "5"

[profile.release]
# Компактная программа
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
